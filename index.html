<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>태양광 일사량 · 구름량 · 발전량 대시보드 (7일 예보)</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100dvh;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
      background: #f8fafc;
      color: #0f172a;
    }
    .app {
      height: 100%;
      max-width: 1920px;
      margin: 0 auto;
      padding: 8px 14px;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr);
      gap: 7px;
    }
    .top-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 6px 12px;
    }
    .title-group {
      display: flex;
      align-items: baseline;
      gap: 10px;
      min-width: 0;
    }
    .title-group h1 {
      margin: 0;
      font-size: 0.98rem;
      font-weight: 700;
      white-space: nowrap;
    }
    .meta {
      font-size: 0.74rem;
      color: #64748b;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }
    .controls label {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.76rem;
      font-weight: 600;
      color: #334155;
      white-space: nowrap;
    }
    .controls select,
    .controls input {
      padding: 3px 6px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.78rem;
      background: #fff;
      color: #0f172a;
    }
    .controls select { min-width: 145px; }
    .controls input { width: 70px; }
    .csv-link {
      font-size: 0.75rem;
      font-weight: 600;
      color: #1d4ed8;
      text-decoration: none;
      padding: 4px 8px;
      border: 1px solid #bfdbfe;
      border-radius: 6px;
      background: #eff6ff;
      white-space: nowrap;
    }
    .csv-link:hover { background: #dbeafe; }

    .summary-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 6px 12px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .summary-card h2 {
      margin: 0;
      font-size: 0.82rem;
      font-weight: 700;
      color: #1e293b;
    }
    .summary-body {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }
    .kpi {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 5px 10px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      min-width: 0;
    }
    .kpi .k-label {
      font-size: 0.72rem;
      color: #64748b;
      white-space: nowrap;
    }
    .kpi .k-val {
      font-size: 0.92rem;
      font-weight: 700;
      color: #0f172a;
      white-space: nowrap;
    }

    .chart-card {
      min-height: 0;
      min-width: 0;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 6px 12px;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 3px;
    }
    .chart-card h2 {
      margin: 0;
      font-size: 0.82rem;
      font-weight: 700;
      color: #1e293b;
      line-height: 1.2;
    }
    .chart-box {
      position: relative;
      min-height: 0;
      min-width: 0;
      width: 100%;
      height: 100%;
    }

    @media (max-width: 900px) {
      html, body { height: auto; overflow: auto; }
      .app { height: auto; display: flex; flex-direction: column; }
      .summary-body { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .chart-box { height: 190px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- 1. 상단 타이틀 및 컨트롤 -->
    <header class="top-bar">
      <div class="title-group">
        <h1>태양광 일사량 · 구름량 · 발전량</h1>
        <span id="meta" class="meta">데이터 불러오는 중...</span>
      </div>
      <div class="controls">
        <label>
          도시
          <select id="citySelect"></select>
        </label>
        <label>
          설비(kWp)
          <input id="capacityKw" type="number" step="0.5" min="0.5" value="10" />
        </label>
        <label>
          PR
          <input id="prValue" type="number" step="0.01" min="0.5" max="0.95" value="0.80" />
        </label>
        <label>
          구름감산 α
          <input id="cloudAlpha" type="number" step="0.05" min="0" max="0.5" value="0.00" />
        </label>
        <a id="csvDownload" class="csv-link" href="./data/csv/samcheok.csv" target="_blank">CSV</a>
      </div>
    </header>

    <!-- 2. 예보 기간 요약 -->
    <section class="summary-card">
      <h2 id="sumTitle">예보 기간 요약</h2>
      <div class="summary-body">
        <div class="kpi">
          <span class="k-label">최대 GHI 일사량</span>
          <span id="kpiMaxGhi" class="k-val">-</span>
        </div>
        <div class="kpi">
          <span class="k-label">평균 구름량</span>
          <span id="kpiAvgCloud" class="k-val">-</span>
        </div>
        <div class="kpi">
          <span class="k-label">최대 예상 출력</span>
          <span id="kpiMaxKw" class="k-val">-</span>
        </div>
        <div class="kpi">
          <span class="k-label">7일 누적 예상 발전량</span>
          <span id="kpiSumKwh" class="k-val">-</span>
        </div>
      </div>
    </section>

    <!-- 3. 일사량 추이 (W/m²) -->
    <section class="chart-card">
      <h2 id="irrTitle">일사량 추이 (W/m²)</h2>
      <div class="chart-box"><canvas id="irradianceChart"></canvas></div>
    </section>

    <!-- 4. 구름량 추이 (%) -->
    <section class="chart-card">
      <h2 id="cloudTitle">구름량 추이 (%)</h2>
      <div class="chart-box"><canvas id="cloudChart"></canvas></div>
    </section>

    <!-- 5. 예상 태양광 발전량 (kW) -->
    <section class="chart-card">
      <h2 id="pwrTitle">예상 태양광 발전량 (kW)</h2>
      <div class="chart-box"><canvas id="powerChart"></canvas></div>
    </section>
  </div>

  <script>
    let irrChart = null;
    let cloudChart = null;
    let pwrChart = null;
    let allCities = {};
    let updatedAtKst = "";

    const commonChartOptions = {
      responsive: true,
      maintainAspectRatio: false,
      animation: false,
      interaction: { mode: "index", intersect: false },
      plugins: {
        legend: {
          position: "top",
          labels: { boxWidth: 10, padding: 8, font: { size: 10 } }
        }
      },
      scales: {
        x: { ticks: { maxTicksLimit: 18, maxRotation: 0, font: { size: 9 } } },
        y: { ticks: { maxTicksLimit: 5, font: { size: 9 } } }
      }
    };

    function populateCitySelect(cityOrder, cities) {
      const select = document.getElementById("citySelect");
      select.innerHTML = "";
      const groups = {};
      cityOrder.forEach(id => {
        const c = cities[id];
        if (!c) return;
        if (!groups[c.group]) {
          const optGroup = document.createElement("optgroup");
          optGroup.label = c.group;
          groups[c.group] = optGroup;
          select.appendChild(optGroup);
        }
        const opt = document.createElement("option");
        opt.value = id;
        opt.textContent = c.name;
        groups[c.group].appendChild(opt);
      });
    }

    function renderCharts() {
      const cityId = document.getElementById("citySelect").value;
      const city = allCities[cityId];
      if (!city) return;

      const records = city.records || [];
      const cap = parseFloat(document.getElementById("capacityKw").value) || 10;
      const pr = parseFloat(document.getElementById("prValue").value) || 0.8;
      const alpha = parseFloat(document.getElementById("cloudAlpha").value) || 0;
      const daysCount = (records.length / 24).toFixed(1).replace(/\.0$/, "");

      document.getElementById("meta").textContent =
        `${city.name} (${city.lat}, ${city.lon} · ${city.timezone}) | 갱신(KST): ${updatedAtKst}`;
      document.getElementById("sumTitle").textContent = `${city.name} 예보 요약 (${daysCount}일 · ${records.length}시간)`;
      document.getElementById("irrTitle").textContent = `${city.name} 일사량 추이 (W/m²)`;
      document.getElementById("cloudTitle").textContent = `${city.name} 구름량 추이 (%)`;
      document.getElementById("pwrTitle").textContent = `${city.name} 예상 태양광 발전량 (kW)`;
      document.getElementById("csvDownload").href = `./data/csv/${cityId}.csv`;

      const labels = records.map(r => r.time_local.slice(5).replace("T", " "));
      const ghi = records.map(r => Number(r.shortwave_radiation ?? 0));
      const dni = records.map(r => Number(r.direct_normal_irradiance ?? 0));
      const dhi = records.map(r => Number(r.diffuse_radiation ?? 0));
      const cloud = records.map(r => Number(r.cloud_cover ?? 0));
      const estKw = records.map(r => {
        const g = Number(r.shortwave_radiation ?? 0);
        const c = Number(r.cloud_cover ?? 0);
        const factor = Math.max(0, 1 - alpha * (c / 100));
        return Number((cap * (g / 1000) * pr * factor).toFixed(2));
      });

      const maxGhi = ghi.length ? Math.max(...ghi) : 0;
      const avgCloud = cloud.length ? (cloud.reduce((a, b) => a + b, 0) / cloud.length) : 0;
      const maxKw = estKw.length ? Math.max(...estKw) : 0;
      const sumKwh = estKw.reduce((a, b) => a + b, 0);

      document.getElementById("kpiMaxGhi").textContent = `${maxGhi.toFixed(0)} W/m²`;
      document.getElementById("kpiAvgCloud").textContent = `${avgCloud.toFixed(1)} %`;
      document.getElementById("kpiMaxKw").textContent = `${maxKw.toFixed(2)} kW`;
      document.getElementById("kpiSumKwh").textContent = `${sumKwh.toFixed(1)} kWh`;

      if (irrChart) irrChart.destroy();
      if (cloudChart) cloudChart.destroy();
      if (pwrChart) pwrChart.destroy();

      irrChart = new Chart(document.getElementById("irradianceChart"), {
        type: "line",
        data: {
          labels,
          datasets: [
            { label: "GHI", data: ghi, borderWidth: 1.8, pointRadius: 0 },
            { label: "DNI", data: dni, borderWidth: 1.8, pointRadius: 0 },
            { label: "DHI", data: dhi, borderWidth: 1.4, pointRadius: 0 }
          ]
        },
        options: commonChartOptions
      });

      cloudChart = new Chart(document.getElementById("cloudChart"), {
        type: "line",
        data: {
          labels,
          datasets: [
            { label: "구름량 (%)", data: cloud, borderWidth: 1.8, pointRadius: 0 }
          ]
        },
        options: {
          ...commonChartOptions,
          scales: {
            ...commonChartOptions.scales,
            y: { min: 0, max: 100, ticks: { stepSize: 50, font: { size: 9 } } }
          }
        }
      });

      pwrChart = new Chart(document.getElementById("powerChart"), {
        type: "line",
        data: {
          labels,
          datasets: [
            { label: "추정 발전량 (kW)", data: estKw, borderWidth: 1.8, pointRadius: 0, fill: true }
          ]
        },
        options: commonChartOptions
      });
    }

    async function init() {
      const metaEl = document.getElementById("meta");
      try {
        const res = await fetch("./data/latest_forecast.json?t=" + Date.now());
        if (!res.ok) throw new Error(`HTTP ${res.status} (${res.statusText})`);
        const data = await res.json();
        updatedAtKst = data.updated_at_kst || "";
        allCities = data.cities || {};
        const order = data.city_order || Object.keys(allCities);
        if (order.length === 0) {
          throw new Error("도시 데이터가 비어 있습니다. Actions를 먼저 실행해 주세요.");
        }
        populateCitySelect(order, allCities);
        renderCharts();
      } catch (err) {
        console.error(err);
        metaEl.textContent = `로드 실패: ${err.message}`;
      }
    }

    document.getElementById("citySelect").addEventListener("change", renderCharts);
    document.getElementById("capacityKw").addEventListener("input", renderCharts);
    document.getElementById("prValue").addEventListener("input", renderCharts);
    document.getElementById("cloudAlpha").addEventListener("input", renderCharts);
    init();
  </script>
</body>
</html>
