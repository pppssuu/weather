<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>태양광 일사량 · 구름량 · 발전량 대시보드 (16:9 한 줄 배치)</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100dvh;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
      background: #f8fafc;
      color: #0f172a;
    }
    .app {
      height: 100%;
      max-width: 1920px;
      margin: 0 auto;
      padding: 10px 14px;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 10px;
    }
    .top-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 8px 14px;
    }
    .title-group {
      display: flex;
      align-items: baseline;
      gap: 10px;
      min-width: 0;
    }
    .title-group h1 {
      margin: 0;
      font-size: 1.02rem;
      font-weight: 700;
      white-space: nowrap;
    }
    .meta {
      font-size: 0.78rem;
      color: #64748b;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }
    .controls label {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #334155;
      white-space: nowrap;
    }
    .controls select,
    .controls input {
      padding: 4px 7px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.82rem;
      background: #fff;
      color: #0f172a;
    }
    .controls select { min-width: 145px; }
    .controls input { width: 74px; }
    .csv-link {
      font-size: 0.78rem;
      font-weight: 600;
      color: #1d4ed8;
      text-decoration: none;
      padding: 5px 9px;
      border: 1px solid #bfdbfe;
      border-radius: 6px;
      background: #eff6ff;
      white-space: nowrap;
    }
    .csv-link:hover { background: #dbeafe; }

    .row-1x4 {
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      grid-template-rows: minmax(0, 1fr);
      gap: 10px;
    }
    .card {
      min-height: 0;
      min-width: 0;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 10px 12px;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 6px;
    }
    .card h2 {
      margin: 0;
      font-size: 0.85rem;
      font-weight: 700;
      color: #1e293b;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .chart-box {
      position: relative;
      min-height: 0;
      min-width: 0;
      width: 100%;
      height: 100%;
    }
    .summary-body {
      display: grid;
      grid-template-rows: repeat(4, minmax(0, 1fr));
      gap: 8px;
      height: 100%;
    }
    .kpi {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .kpi .k-label { font-size: 0.74rem; color: #64748b; }
    .kpi .k-val { font-size: 1.05rem; font-weight: 700; color: #0f172a; margin-top: 2px; }

    @media (max-width: 1280px) {
      html, body { height: auto; overflow: auto; }
      .app { height: auto; grid-template-rows: auto auto; }
      .row-1x4 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-template-rows: auto;
      }
      .card { min-height: 260px; }
      .summary-body { grid-template-rows: none; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 720px) {
      .row-1x4 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="top-bar">
      <div class="title-group">
        <h1>태양광 일사량 · 구름량 · 발전량</h1>
        <span id="meta" class="meta">데이터 불러오는 중...</span>
      </div>
      <div class="controls">
        <label>
          도시
          <select id="citySelect"></select>
        </label>
        <label>
          설비(kWp)
          <input id="capacityKw" type="number" step="0.5" min="0.5" value="10" />
        </label>
        <label>
          PR
          <input id="prValue" type="number" step="0.01" min="0.5" max="0.95" value="0.80" />
        </label>
        <label>
          구름감산 α
          <input id="cloudAlpha" type="number" step="0.05" min="0" max="0.5" value="0.00" />
        </label>
        <a id="csvDownload" class="csv-link" href="./data/csv/samcheok.csv" target="_blank">CSV</a>
      </div>
    </header>

    <main class="row-1x4">
      <section class="card">
        <h2 id="irrTitle">일사량 추이 (W/m²)</h2>
        <div class="chart-box"><canvas id="irradianceChart"></canvas></div>
      </section>

      <section class="card">
        <h2 id="cloudTitle">구름량 추이 (%)</h2>
        <div class="chart-box"><canvas id="cloudChart"></canvas></div>
      </section>

      <section class="card">
        <h2 id="pwrTitle">예상 태양광 발전량 (kW)</h2>
        <div class="chart-box"><canvas id="powerChart"></canvas></div>
      </section>

      <section class="card">
        <h2 id="sumTitle">예보 기간 요약</h2>
        <div class="summary-body">
          <div class="kpi">
            <div class="k-label">최대 GHI 일사량</div>
            <div id="kpiMaxGhi" class="k-val">-</div>
          </div>
          <div class="kpi">
            <div class="k-label">평균 구름량</div>
            <div id="kpiAvgCloud" class="k-val">-</div>
          </div>
          <div class="kpi">
            <div class="k-label">최대 예상 출력</div>
            <div id="kpiMaxKw" class="k-val">-</div>
          </div>
          <div class="kpi">
            <div class="k-label">누적 예상 발전량</div>
            <div id="kpiSumKwh" class="k-val">-</div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script>
    let irrChart = null;
    let cloudChart = null;
    let pwrChart = null;
    let allCities = {};
    let updatedAtKst = "";

    const commonChartOptions = {
      responsive: true,
      maintainAspectRatio: false,
      animation: false,
      interaction: { mode: "index", intersect: false },
      plugins: { legend: { labels: { boxWidth: 10, font: { size: 10 } } } },
      scales: {
        x: { ticks: { maxTicksLimit: 7, font: { size: 9 } } },
        y: { ticks: { font: { size: 9 } } }
      }
    };

    function populateCitySelect(cityOrder, cities) {
      const select = document.getElementById("citySelect");
      select.innerHTML = "";
      const groups = {};
      cityOrder.forEach(id => {
        const c = cities[id];
        if (!c) return;
        if (!groups[c.group]) {
          const optGroup = document.createElement("optgroup");
          optGroup.label = c.group;
          groups[c.group] = optGroup;
          select.appendChild(optGroup);
        }
        const opt = document.createElement("option");
        opt.value = id;
        opt.textContent = c.name;
        groups[c.group].appendChild(opt);
      });
    }

    function renderCharts() {
      const cityId = document.getElementById("citySelect").value;
      const city = allCities[cityId];
      if (!city) return;

      const records = city.records || [];
      const cap = parseFloat(document.getElementById("capacityKw").value) || 10;
      const pr = parseFloat(document.getElementById("prValue").value) || 0.8;
      const alpha = parseFloat(document.getElementById("cloudAlpha").value) || 0;

      document.getElementById("meta").textContent =
        `${city.name} (${city.lat}, ${city.lon} · ${city.timezone}) | 갱신(KST): ${updatedAtKst}`;
      document.getElementById("irrTitle").textContent = `${city.name} 일사량 (W/m²)`;
      document.getElementById("cloudTitle").textContent = `${city.name} 구름량 (%)`;
      document.getElementById("pwrTitle").textContent = `${city.name} 예상 발전량 (kW)`;
