<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>국내·세계 주요도시 태양광 일사량 & 발전량 대시보드</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; max-width: 1060px; margin: 24px auto; padding: 0 16px; color: #1f2937; }
    .controls { display: flex; flex-wrap: wrap; gap: 16px; background: #f3f4f6; padding: 14px; border-radius: 10px; margin-bottom: 20px; align-items: end; }
    .controls label { display: flex; flex-direction: column; font-size: 0.9rem; gap: 4px; }
    .controls input, .controls select { padding: 6px 8px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 0.95rem; background: #fff; }
    .controls select { min-width: 190px; }
    .controls input { width: 135px; }
    .csv-link { font-size: 0.88rem; color: #2563eb; text-decoration: none; padding: 7px 10px; border: 1px solid #bfdbfe; border-radius: 6px; background: #eff6ff; }
    .card { border: 1px solid #e5e7eb; border-radius: 12px; padding: 16px; margin-bottom: 20px; background: #fff; }
    .meta { font-size: 0.85rem; color: #6b7280; margin-bottom: 12px; }
  </style>
</head>
<body>
  <h1>태양광 일사량 · 구름량 · 발전량 모니터링</h1>
  <div id="meta" class="meta">데이터 불러오는 중...</div>

  <div class="controls">
    <label>
      도시 선택
      <select id="citySelect"></select>
    </label>
    <label>
      설비용량 (kWp)
      <input id="capacityKw" type="number" step="0.5" min="0.5" value="10" />
    </label>
    <label>
      성능비 PR (0.5 ~ 0.95)
      <input id="prValue" type="number" step="0.01" min="0.5" max="0.95" value="0.80" />
    </label>
    <label>
      구름 추가 감산계수 α (0 ~ 0.5)
      <input id="cloudAlpha" type="number" step="0.05" min="0" max="0.5" value="0.00" />
    </label>
    <a id="csvDownload" class="csv-link" href="./data/csv/samcheok.csv" target="_blank">선택 도시 CSV 보기</a>
  </div>

  <div class="card">
    <h2 id="irrTitle">일사량 추이 (W/m²)</h2>
    <canvas id="irradianceChart" height="95"></canvas>
  </div>

  <div class="card">
    <h2 id="cloudTitle">구름량 추이 (%)</h2>
    <canvas id="cloudChart" height="75"></canvas>
  </div>

  <div class="card">
    <h2 id="pwrTitle">예상 태양광 발전량 (kW, 수식 추정)</h2>
    <canvas id="powerChart" height="90"></canvas>
  </div>

  <script>
    let irrChart = null;
    let cloudChart = null;
    let pwrChart = null;
    let allCities = {};
    let updatedAtKst = "";

    function populateCitySelect(cityOrder, cities) {
      const select = document.getElementById("citySelect");
      select.innerHTML = "";

      const groups = {};
      cityOrder.forEach(id => {
        const c = cities[id];
        if (!c) return;
        if (!groups[c.group]) {
          const optGroup = document.createElement("optgroup");
          optGroup.label = c.group;
          groups[c.group] = optGroup;
          select.appendChild(optGroup);
        }
        const opt = document.createElement("option");
        opt.value = id;
        opt.textContent = c.name;
        groups[c.group].appendChild(opt);
      });
    }

    function renderCharts() {
      const cityId = document.getElementById("citySelect").value;
      const city = allCities[cityId];
      if (!city) return;

      const records = city.records || [];
      const cap = parseFloat(document.getElementById("capacityKw").value) || 10;
      const pr = parseFloat(document.getElementById("prValue").value) || 0.8;
      const alpha = parseFloat(document.getElementById("cloudAlpha").value) || 0;

      document.getElementById("meta").textContent =
        `선택 도시: ${city.name} (위도 ${city.lat}, 경도 ${city.lon}, 현지시간대 ${city.timezone}) · 최근 수집(KST): ${updatedAtKst}`;
      document.getElementById("irrTitle").textContent = `${city.name} 일사량 추이 (W/m², 현지시각 기준)`;
      document.getElementById("cloudTitle").textContent = `${city.name} 구름량 추이 (%)`;
      document.getElementById("pwrTitle").textContent = `${city.name} 예상 태양광 발전량 (kW, 수식 추정)`;
      document.getElementById("csvDownload").href = `./data/csv/${cityId}.csv`;

      const labels = records.map(r => r.time_local.replace("T", " "));
      const ghi = records.map(r => Number(r.shortwave_radiation ?? 0));
      const dni = records.map(r => Number(r.direct_normal_irradiance ?? 0));
      const dhi = records.map(r => Number(r.diffuse_radiation ?? 0));
      const cloud = records.map(r => Number(r.cloud_cover ?? 0));

      const estKw = records.map(r => {
        const g = Number(r.shortwave_radiation ?? 0);
        const c = Number(r.cloud_cover ?? 0);
        const factor = Math.max(0, 1 - alpha * (c / 100));
        return Number((cap * (g / 1000) * pr * factor).toFixed(2));
      });

      if (irrChart) irrChart.destroy();
      if (cloudChart) cloudChart.destroy();
      if (pwrChart) pwrChart.destroy();

      irrChart = new Chart(document.getElementById("irradianceChart"), {
        type: "line",
        data: {
          labels,
          datasets: [
            { label: "GHI (shortwave_radiation)", data: ghi, borderWidth: 2, pointRadius: 1 },
            { label: "DNI (direct_normal_irradiance)", data: dni, borderWidth: 2, pointRadius: 1 },
            { label: "DHI (diffuse_radiation)", data: dhi, borderWidth: 1.5, pointRadius: 1 }
          ]
        },
        options: { responsive: true, interaction: { mode: "index", intersect: false } }
      });

      cloudChart = new Chart(document.getElementById("cloudChart"), {
        type: "line",
        data: {
          labels,
          datasets: [
            { label: "구름량 (cloud_cover, %)", data: cloud, borderWidth: 2, pointRadius: 1 }
          ]
        },
        options: {
          responsive: true,
          interaction: { mode: "index", intersect: false },
          scales: { y: { min: 0, max: 100 } }
        }
      });

      pwrChart = new Chart(document.getElementById("powerChart"), {
        type: "line",
        data: {
          labels,
          datasets: [
            { label: "추정 발전량 (kW)", data: estKw, borderWidth: 2, pointRadius: 1, fill: true }
          ]
        },
        options: { responsive: true, interaction: { mode: "index", intersect: false } }
      });
    }

    async function init() {
      const res = await fetch("./data/latest_forecast.json?t=" + Date.now());
      const data = await res.json();
      updatedAtKst = data.updated_at_kst || "";
      allCities = data.cities || {};
      const order = data.city_order || Object.keys(allCities);
      populateCitySelect(order, allCities);
      renderCharts();
    }

    document.getElementById("citySelect").addEventListener("change", renderCharts);
    document.getElementById("capacityKw").addEventListener("input", renderCharts);
    document.getElementById("prValue").addEventListener("input", renderCharts);
    document.getElementById("cloudAlpha").addEventListener("input", renderCharts);
    init();
  </script>
</body>
</html>
